name: clinical-trials-ai-mcp
description: MCP server for clinical trials ai. Features search trials, check eligibility,
  get trial details. From MEOK AI Labs.
version: 1.0.0
tools:
- name: search_trials
  description: Search clinical trials by condition, drug, phase, status, or location.
  parameters:
  - name: condition
    type: string
    required: false
  - name: drug
    type: string
    required: false
  - name: phase
    type: string
    required: false
  - name: status
    type: string
    required: false
  - name: location
    type: string
    required: false
- name: check_eligibility
  description: Evaluate whether a patient meets eligibility criteria for a specific
    trial. Conditions as comma-separated string.
  parameters:
  - name: trial_id
    type: string
    required: true
  - name: patient_age
    type: integer
    required: true
  - name: patient_gender
    type: string
    required: false
  - name: conditions
    type: string
    required: false
- name: get_trial_details
  description: Get comprehensive details for a specific clinical trial.
  parameters:
  - name: trial_id
    type: string
    required: true
- name: compare_trials
  description: Compare multiple clinical trials side by side. Pass trial IDs as comma-separated
    string.
  parameters:
  - name: trial_ids
    type: string
    required: true
- name: get_trial_endpoints
  description: Get detailed primary and secondary endpoint information for a trial.
  parameters:
  - name: trial_id
    type: string
    required: true
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['clinical-trials-ai-mcp',\
    \ '--api-key', config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n\
    })"
